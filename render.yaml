# render.yaml - Render Blueprint for the TEMPORARY UAT of the People Experience (PX) app (v2.61.1).
#
# UAT only, with DUMMY/seed data (SEED_DEMO_DATA). Production stays on-premise on SQL Server - never point this
# Blueprint at real data, real accounts, real ESS / Exit Interview files.
#
# One Web Service: Express serves the API AND the built frontend (dist/) from the same origin, which the
# SameSite=Strict session cookie and the Origin check need. No Ollama and no Video Extractor on Render: video
# transcripts fail with the usual "service not active" message, so no video AI summary is ever made (summaries are
# only queued after a transcript is DONE).
# Free web services have no shell and no persistent disk: uploads (server/uploads, server/data/*-uploads) are lost
# on every redeploy/restart; the database rows stay.
#
# Values never live in this file: DEFAULT_INITIAL_PASSWORD and BOOTSTRAP_ADMIN_USERNAME are typed in the Render
# dashboard (sync: false). SETTINGS_ENCRYPTION_KEY is generated by Render once (base64 of 32 bytes, accepted by
# server/services/secretBox.js) and must not be changed afterwards (stored e-mail passwords would become unreadable).

services:
  - type: web
    name: px-uat
    runtime: node
    region: singapore
    # free = sleeps after 15 min idle (cold start ~1 min), 512 MB RAM. For an always-on UAT switch to: plan: starter
    plan: free
    # Vite (build tool) is a devDependency and NODE_ENV=production would make npm skip devDependencies.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: node server/server.js
    healthCheckPath: /api/health
    envVars:
      # Vite 8 needs Node ^20.19 || >=22.12 (concurrently 10: >=22); same version as the local development machine.
      - key: NODE_VERSION
        value: 24.19.0
      - key: NODE_ENV
        value: production
      # Dates, months and the reminder hour follow the server clock; keep it on Jakarta time like the on-premise server.
      - key: TZ
        value: Asia/Jakarta
      - key: STORAGE_BACKEND
        value: pg
      # Internal connection string (private network, no SSL needed - do not set PG_SSL).
      - key: DATABASE_URL
        fromDatabase:
          name: px-uat-db
          property: connectionString
      - key: SEED_DEMO_DATA
        value: "true"
      # Render terminates HTTPS in front of the app: req.secure (Secure cookie) and req.ip come from X-Forwarded-*.
      - key: TRUST_PROXY
        value: "1"
      - key: SETTINGS_ENCRYPTION_KEY
        generateValue: true
      # First Admin account (no shell on Render for `npm run auth:create-admin`): created at boot only when no active
      # Admin exists, with password DEFAULT_INITIAL_PASSWORD, which must be changed at the first sign-in.
      # Optional: BOOTSTRAP_ADMIN_NAME, BOOTSTRAP_ADMIN_EMAIL (add them in the dashboard if wanted).
      - key: BOOTSTRAP_ADMIN_USERNAME
        sync: false
      - key: DEFAULT_INITIAL_PASSWORD
        sync: false

databases:
  - name: px-uat-db
    databaseName: peopleexperiencepx
    user: px_app
    region: singapore
    # free = expires 30 days after creation (14-day grace period, then deleted). Paid: e.g. plan: basic-256mb
    plan: free
    # schema.pg.sql needs PostgreSQL 15+ (NULLS NOT DISTINCT) and the citext extension
    postgresMajorVersion: "17"
    # no access from outside Render (the web service uses the internal network)
    ipAllowList: []
